<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Traditional Indian thali</title>
  <desc id="desc">A warm illustrated thali with dal, curry, rice, rotis, salad and chutney.</desc>
  <defs>
    <radialGradient id="thali" cx="45%" cy="35%">
      <stop offset="0" stop-color="#f8e8bd"/>
      <stop offset=".78" stop-color="#d1a15a"/>
      <stop offset="1" stop-color="#95602f"/>
    </radialGradient>
    <linearGradient id="roti" x2="0" y2="1">
      <stop stop-color="#e3ad5f"/>
      <stop offset="1" stop-color="#a85e2f"/>
    </linearGradient>
    <radialGradient id="dal">
      <stop stop-color="#e3ad42"/>
      <stop offset="1" stop-color="#a45229"/>
    </radialGradient>
    <radialGradient id="curry">
      <stop stop-color="#c77838"/>
      <stop offset="1" stop-color="#703526"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#6f4725" flood-opacity=".25"/>
    </filter>
  </defs>
  <ellipse cx="300" cy="320" rx="245" ry="205" fill="#8b5b2e" opacity=".16"/>
  <ellipse cx="300" cy="292" rx="244" ry="218" fill="url(#thali)" stroke="#8d5b2b" stroke-width="10" filter="url(#shadow)"/>
  <ellipse cx="300" cy="285" rx="211" ry="184" fill="#fff5d9" stroke="#c18b43" stroke-width="7"/>
  <!-- dal katori -->
  <ellipse cx="169" cy="183" rx="82" ry="23" fill="#7e4428"/>
  <path d="M87 181v30c0 43 164 43 164 0v-30Z" fill="#b96635" stroke="#753f29" stroke-width="6"/>
  <ellipse cx="169" cy="181" rx="82" ry="25" fill="url(#dal)" stroke="#753f29" stroke-width="6"/>
  <circle cx="137" cy="176" r="5" fill="#8d4b24"/><circle cx="181" cy="188" r="5" fill="#8d4b24"/><circle cx="204" cy="172" r="4" fill="#8d4b24"/>
  <path d="M157 159q14-16 28 0" fill="none" stroke="#e6a348" stroke-width="5"/>
  <!-- curry katori -->
  <ellipse cx="431" cy="183" rx="82" ry="23" fill="#63382a"/>
  <path d="M349 181v30c0 43 164 43 164 0v-30Z" fill="#8e4d2e" stroke="#653326" stroke-width="6"/>
  <ellipse cx="431" cy="181" rx="82" ry="25" fill="url(#curry)" stroke="#653326" stroke-width="6"/>
  <circle cx="402" cy="177" r="9" fill="#7f9a4d"/><circle cx="449" cy="189" r="8" fill="#d49b43"/><circle cx="469" cy="170" r="6" fill="#7f9a4d"/>
  <!-- rice mound -->
  <path d="M365 319q4-62 62-66 58 5 63 66Z" fill="#fff9df" stroke="#c9a86d" stroke-width="6"/>
  <path d="M390 286q14-19 28 0m5-10q15-19 29 2m4 8q14-17 27 1" fill="none" stroke="#d4b67d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="447" cy="273" r="6" fill="#8e9b59"/>
  <!-- stacked rotis -->
  <ellipse cx="215" cy="375" rx="105" ry="38" fill="#b36b32" opacity=".45"/>
  <ellipse cx="215" cy="359" rx="106" ry="40" fill="url(#roti)" stroke="#9a5d2d" stroke-width="6" transform="rotate(-8 215 359)"/>
  <ellipse cx="222" cy="343" rx="104" ry="39" fill="url(#roti)" stroke="#a86530" stroke-width="6" transform="rotate(7 222 343)"/>
  <path d="M164 344q48-21 101 1M174 357q46-20 86-2M187 329q27 9 63 2" fill="none" stroke="#a45c2c" stroke-width="5" opacity=".7"/>
  <!-- salad -->
  <path d="M114 445q45-48 103-8-20 51-80 55Z" fill="#78a05a" stroke="#4d713f" stroke-width="6"/>
  <circle cx="143" cy="439" r="17" fill="#d84d3c" stroke="#a53c32" stroke-width="4"/>
  <circle cx="174" cy="463" r="16" fill="#e06347" stroke="#a53c32" stroke-width="4"/>
  <circle cx="204" cy="438" r="15" fill="#d94b39" stroke="#a53c32" stroke-width="4"/>
  <circle cx="143" cy="439" r="4" fill="#f5c477"/><circle cx="174" cy="463" r="4" fill="#f5c477"/>
  <!-- chutney and laddoo -->
  <ellipse cx="359" cy="445" rx="45" ry="25" fill="#597844" stroke="#3e5b35" stroke-width="5"/>
  <circle cx="438" cy="441" r="30" fill="#e4ad43" stroke="#a97225" stroke-width="6"/>
  <circle cx="428" cy="432" r="4" fill="#9a6422"/><circle cx="448" cy="451" r="4" fill="#9a6422"/>
  <path d="M289 493q11-19 22 0m12 0q11-19 22 0" fill="none" stroke="#648148" stroke-width="7" stroke-linecap="round"/>
</svg>
